services:
  backend:
    build:
      context: ./ParkingFineService
      dockerfile: Dockerfile
    image: venkatanagasasank/docker-backend-task:latest
    container_name: parkingfine-backend-compose
    ports:
      - "8083:8081"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: venkatanagasasank/docker-frontend-tasks:latest
    container_name: parkingfine-frontend-compose
    ports:
      - "3000:80"
    depends_on:
      - backend